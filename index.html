<!doctype html> <!-- Avisa qual é a versão do HTM, HTML moderno -->
<html lang="pt-BR"> <!-- o Lang indica qual é o idioma da página, implicando os tradutores automáticos de websites e leitores de tela -->

</html> 
    <head> <!-- Aqui vão os metadados -->
        <meta charset="UTF-8"> <!-- Dicionário do teclado, por exemplo o ç, o UTF-8 indica o dicionário do Brasil os caracateres do português. É SEMPRE O PRIMEIRO METADADO A ADICIONAR -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Define que a largura da página acopanhe a do dispositivo onde esticer sendo vizualizado -->
        <title> Meu website - Início </title> <!-- Título da página-->
        <!-- Todos acima são metadados essenciais. -->
    </head>

    <body> <!-- Onde vai o principal da página, as imagens, textos, o que as pessoas podem ver -->
        
    </body>
</html> <!-- Fechamento do código html -->

<!-- Tags sempre em minúsculos, "etiqueta" da internet. Tags são os head, body, metadados, etc -->
