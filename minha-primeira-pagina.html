<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clube Patinhas</title>
</head>
<body>
    <h1>Clube Patinhas</h1> <!-- h1 é uma tag de título, o correto é ter um único h1 por página - o assunto principal -->
    <!-- Existem seis níveis de títulos, do h1 ao h6, não se pula ordem -->
     <!-- 1 h1 por página; mas  h2, h3 ... pode ter mais  -->
    <h2>Como cuidar</h2>
    <h3>Aliemntação</h3>
    <p>Escove os dentes <em>só com pastas para cães</em> </p>
    <!-- em é textos em itálico-->
    <h3>Passeios</h3>
    <p>Filhotes só passeiam <strong>com as vacinas em dia</strong> </p>
    <!-- p é parágrafo, strong é para deixar em negrito -->

    <ol> <!-- Lista ordenada em números -->
        <li>Pegar a guia</li>
        <li>Passear</li>
        <li>Dar água</li>
    </ol>
    <!-- A tag ol abre a lista e li são os elementos desta lista -->

    <h2>Raças</h2>
    <ul> <!-- Lista não definida. A tag ul abre a lista e li são os elementos dessa lista-->
        <li>Beagle</li> <!-- Coisas que vou mostrar na lista, nesse caso, lista com pontinho -->
        <li>Poodle</li>
        <li>Vira-lata</li>
    </ul>

    <dl> 
        <dt>Filhote</dt>
        <dd>Cão com menos de um ano.</dd>
    </dl>
    <!--Usado para criar uma definição -->
    <!-- A tag dt é para o título e dd para descrição -->

    <a href="https://pt.wikipedia.org/wiki/C%C3%A3o" target="_blank" rel="noopener noreferrer":>Sobre cães - Wikipédia</a>
    <!-- A tag é para criar links -->
    <!-- No atributo hre, colocamos o endereço da página que queremos redirecionar -->
    <!-- O atributo target é usado para indicar se, ao clicar no link, a página abrirá na mesma aba/janela ou em uma ova aba/nova janela -->
    <!-- O atributo rel="noopener no refeerer" define que, ao clicar no link e abrir uma nova aba, ele não poderá manipular a aba original (reverse tabnabbing) e impedirá que o site de destino saiba de qual página veio o tráfego original -->

    <img src="orelha.jpg" alt="Um cachorro caramelo, representante oficial do Brasil."> 
    <!-- A tag img é para colocar imagem no HTML -->
    <!-- O atributo alt deve sempre estar informado com uma descrição -->
</body>
</html>
